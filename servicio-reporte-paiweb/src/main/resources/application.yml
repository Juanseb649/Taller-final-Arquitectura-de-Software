server:
  port: 8083

spring:
  application:
    name: servicio-reporte-paiweb
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 2s
          multiplier: 2
          max-interval: 10s

paiweb:
  disponible: ${PAIWEB_DISPONIBLE:true}
