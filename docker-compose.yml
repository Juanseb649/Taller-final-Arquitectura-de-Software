services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  vacunacion:
    build: ./servicio-vacunacion
    ports:
      - "8081:8081"
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  notificaciones:
    build: ./servicio-notificaciones
    ports:
      - "8082:8082"
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  reporte-paiweb:
    build: ./servicio-reporte-paiweb
    ports:
      - "8083:8083"
    environment:
      RABBITMQ_HOST: rabbitmq
      PAIWEB_DISPONIBLE: "true"
    depends_on:
      rabbitmq:
        condition: service_healthy
